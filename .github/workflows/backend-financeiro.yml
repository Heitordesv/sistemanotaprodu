name: Backend Financeiro

on:
  push:
    branches:
      - agent/backend-senior
  pull_request:
    branches:
      - main

jobs:
  financeiro:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sistemanota_test
          MYSQL_USER: sistemanota
          MYSQL_PASSWORD: sistemanota
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://localhost
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sistemanota_test
      DB_USERNAME: sistemanota
      DB_PASSWORD: sistemanota
      RUN_MYSQL_CONCURRENCY_TESTS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, pdo_mysql, sqlite3, pcntl, xml, curl, zip
          coverage: none

      - name: Prepare Laravel writable directories
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          chmod -R ug+rwX bootstrap/cache storage

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Clear Laravel config
        run: php artisan config:clear

      - name: Feature tests do fluxo financeiro
        run: |
          vendor/bin/phpunit tests/Feature/CaixaRecebimentosTest.php
          vendor/bin/phpunit tests/Feature/CaixaVinculoAberturaTest.php
          vendor/bin/phpunit tests/Feature/VendaTenantIsolationTest.php
          vendor/bin/phpunit tests/Feature/VendaCaixaImutabilidadeTest.php
          vendor/bin/phpunit tests/Feature/CaixaMovimentacaoRoutesTest.php
          vendor/bin/phpunit tests/Feature/SangriaDinheiroGavetaTest.php
          vendor/bin/phpunit tests/Feature/ContaReceberPagamentoConcorrenciaTest.php
          vendor/bin/phpunit tests/Feature/ContaReceberPagamentoIdempotenciaTest.php

      - name: MySQL InnoDB concurrency and migration tests
        run: |
          vendor/bin/phpunit tests/Integration/ContaReceberMysqlConcurrencyTest.php
          vendor/bin/phpunit tests/Integration/CaixaMovimentacaoMysqlConcurrencyTest.php
          vendor/bin/phpunit tests/Integration/VendaCaixaEdicaoMysqlConcurrencyTest.php
          vendor/bin/phpunit tests/Integration/FinanceiroMigrationMysqlTest.php
